<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Sky Striker</title>
<style>
  html,body{margin:0;height:100%;background:#04020c;overflow:hidden;
    font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    user-select:none;-webkit-user-select:none}
  canvas{display:block;margin:0 auto;touch-action:none;cursor:crosshair}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
// ================= 캔버스 / 유틸 =================
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const W = 600, H = 900;
let SC = 1, DPR = 1;
function resize() {
  SC = Math.min(innerWidth / W, innerHeight / H);
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = Math.round(W * SC * DPR); cv.height = Math.round(H * SC * DPR);
  cv.style.width = W * SC + 'px'; cv.style.height = H * SC + 'px';
  cv.style.marginTop = Math.max(0, (innerHeight - H * SC) / 2) + 'px';
}
addEventListener('resize', resize); resize();

const TAU = Math.PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const eOutCubic = t => 1 - Math.pow(1 - t, 3);
const eOutBack = t => { const c = 1.70158; t -= 1; return 1 + (c + 1) * t * t * t + c * t * t; };
const eOutElastic = t => t === 0 ? 0 : t === 1 ? 1 : Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * (TAU / 3)) + 1;

// 글로우 스프라이트 캐시
const gcache = {};
function glow(c, soft) {
  const k = c + (soft ? 's' : '');
  if (gcache[k]) return gcache[k];
  const s = document.createElement('canvas'); s.width = s.height = 128;
  const g = s.getContext('2d'), gr = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  if (soft) { gr.addColorStop(0, c); gr.addColorStop(1, 'rgba(0,0,0,0)'); }
  else { gr.addColorStop(0, '#fff'); gr.addColorStop(.16, c); gr.addColorStop(1, 'rgba(0,0,0,0)'); }
  g.fillStyle = gr; g.fillRect(0, 0, 128, 128);
  return gcache[k] = s;
}
function G(c, x, y, sz, a = 1, soft) {
  if (a <= 0 || sz <= 0) return;
  ctx.globalAlpha = a; ctx.drawImage(glow(c, soft), x - sz / 2, y - sz / 2, sz, sz); ctx.globalAlpha = 1;
}
function mkOverlay(inner, color) {
  const s = document.createElement('canvas'); s.width = W; s.height = H;
  const g = s.getContext('2d'), gr = g.createRadialGradient(W / 2, H / 2, H * inner, W / 2, H / 2, H * .72);
  gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(1, color);
  g.fillStyle = gr; g.fillRect(0, 0, W, H); return s;
}
const VIG = mkOverlay(.32, 'rgba(0,0,0,.7)');
const DVIG = mkOverlay(.2, 'rgba(255,0,50,.9)');

// ================= 사운드 (WebAudio 합성) =================
let AC = null, master, noiseBuf;
function initAudio() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = .35; master.connect(AC.destination);
    noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  } catch (e) { AC = null; }
}
function tone(f, dur, type = 'square', vol = .1, slide = 0, delay = 0) {
  if (!AC) return; const t = AC.currentTime + delay;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, f * slide), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + .02);
}
function noise(dur, vol = .3, freq = 1000) {
  if (!AC) return; const t = AC.currentTime;
  const s = AC.createBufferSource(); s.buffer = noiseBuf;
  const f = AC.createBiquadFilter(); f.type = 'lowpass';
  f.frequency.setValueAtTime(freq, t); f.frequency.exponentialRampToValueAtTime(50, t + dur);
  const g = AC.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t + dur);
}
let lastShootS = 0, lastHitS = 0, lastBoomS = 0;
const sfx = {
  shoot() { if (T - lastShootS < .08) return; lastShootS = T; tone(1200, .05, 'square', .018, .4); },
  hit() { if (T - lastHitS < .05) return; lastHitS = T; tone(420, .04, 'sawtooth', .03, .5); },
  boom(big) { if (!big && T - lastBoomS < .04) return; lastBoomS = T;
    noise(big ? 1.4 : .45, big ? .7 : .28, big ? 3000 : 1600); tone(big ? 80 : 150, big ? 1 : .3, 'sine', big ? .45 : .2, .3); },
  power() { [523, 659, 784, 1046, 1318].forEach((f, i) => tone(f, .14, 'triangle', .09, 0, i * .055)); },
  hurt() { tone(220, .35, 'sawtooth', .16, .25); noise(.3, .25, 900); },
  bomb() { noise(2.2, .8, 5000); tone(55, 1.8, 'sine', .55, .35); tone(880, 1, 'triangle', .1, .2); },
  warn() { for (let i = 0; i < 4; i++) { tone(520, .22, 'square', .07, 0, i * .5); tone(390, .22, 'square', .07, 0, i * .5 + .25); } },
  clear() { [392, 523, 659, 784, 1046].forEach((f, i) => tone(f, .3, 'triangle', .12, 0, i * .11)); },
  start() { tone(220, .5, 'sawtooth', .1, 4); noise(.6, .2, 4000); },
};

// ================= 입력 =================
const keys = {};
let bombPressed = false, startPressed = false, paused = false;
addEventListener('keydown', e => {
  keys[e.code] = true; initAudio();
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
  if (e.repeat) return;
  if (state === 'play' && (e.code === 'KeyX' || e.code === 'KeyB' || e.code === 'ShiftLeft')) bombPressed = true;
  if (state === 'play' && (e.code === 'KeyP' || e.code === 'Escape')) paused = !paused;
  if ((e.code === 'Space' || e.code === 'Enter') && state !== 'play') startPressed = true;
});
addEventListener('keyup', e => keys[e.code] = false);
document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'play') paused = true; });

const ptr = { down: false, x: 0, y: 0, dx: 0, dy: 0, id: null };
const BOMB_BTN = { x: W - 56, y: H - 64, r: 36 };
function toLocal(e) { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) / SC, y: (e.clientY - r.top) / SC }; }
cv.addEventListener('pointerdown', e => {
  initAudio(); const p = toLocal(e);
  if (state !== 'play') { startPressed = true; return; }
  if (paused) { paused = false; return; }
  if (Math.hypot(p.x - BOMB_BTN.x, p.y - BOMB_BTN.y) < BOMB_BTN.r + 8) { bombPressed = true; return; }
  ptr.down = true; ptr.id = e.pointerId; ptr.x = p.x; ptr.y = p.y;
  cv.setPointerCapture(e.pointerId);
});
cv.addEventListener('pointermove', e => {
  if (!ptr.down || e.pointerId !== ptr.id) return;
  const p = toLocal(e); ptr.dx += p.x - ptr.x; ptr.dy += p.y - ptr.y; ptr.x = p.x; ptr.y = p.y;
});
const ptrUp = e => { if (e.pointerId === ptr.id) ptr.down = false; };
cv.addEventListener('pointerup', ptrUp); cv.addEventListener('pointercancel', ptrUp);

// ================= 게임 상태 =================
let state = 'title', T = 0, stateT = 0, stageT = 0, stage = 1;
let score = 0, dispScore = 0, scorePop = 0, hiscore = 0, newRecord = false;
try { hiscore = +localStorage.getItem('skystriker_hi') || 0; } catch (e) {}
let combo = 0, comboT = 0, comboPop = 0, maxCombo = 0, kills = 0;
let shake = 0, flash = 0, flashColor = '#fff', dmgFlash = 0, hitStop = 0;
let timeScale = 1, targetTS = 1, slowT = 0;
let scrollBoost = 0, bossWarned = false, boss = null, spawnT = 2, deathT = 0;
let player, bullets = [], missiles = [], ebullets = [], enemies = [], parts = [], rings = [], texts = [], items = [], banners = [], queue = [];
let bombWave = null;

const PAL = [
  { bg1: '#06041a', bg2: '#1c0b40', neb: ['#5b2bd6', '#c02a8f', '#2a5bd6'] },
  { bg1: '#020b18', bg2: '#06324d', neb: ['#1a8fb0', '#21b88c', '#3050e0'] },
  { bg1: '#140309', bg2: '#3d0b1c', neb: ['#d63a2b', '#c27a1f', '#8f1ac0'] },
  { bg1: '#030f0a', bg2: '#0b3a26', neb: ['#2bc65b', '#1a9fc0', '#9fc02b'] },
];
const STAGE_NAMES = ['보랏빛 성운', '심해의 하늘', '불타는 궤도', '에메랄드 전선'];
const pal = () => PAL[(stage - 1) % PAL.length];

function later(t, fn) { queue.push({ t, fn }); }
function slowMo(ts, dur) { targetTS = ts; slowT = dur; }
function addShake(v) { shake = Math.max(shake, v); }
function doFlash(a, c = '#fff') { flash = Math.max(flash, a); flashColor = c; }
function popText(x, y, text, color = '#fff', size = 18, life = .9) { texts.push({ x, y, text, color, size, life, max: life }); }
function banner(text, sub, color = '#5ef', dur = 2.6, warn = false) { banners.push({ text, sub, color, dur, t: 0, warn }); }

// ================= 배경 =================
const stars = [], nebs = [], clouds = [];
for (let i = 0; i < 170; i++) stars.push({ x: rand(0, W), y: rand(0, H), z: rand(.15, 1), tw: rand(0, TAU) });
for (let i = 0; i < 6; i++) nebs.push({ x: rand(0, W), y: rand(-H, H), r: rand(260, 520), c: i % 3, s: rand(8, 20) });
for (let i = 0; i < 7; i++) clouds.push({ x: rand(-50, W + 50), y: rand(-H, H), r: rand(90, 200), s: rand(500, 800) });

function updBg(dt) {
  const sp = 1 + scrollBoost;
  for (const s of stars) { s.y += (40 + s.z * s.z * 520) * sp * dt; if (s.y > H + 40) { s.y = -rand(0, 60); s.x = rand(0, W); } }
  for (const n of nebs) { n.y += n.s * sp * dt; if (n.y - n.r > H) { n.y = -n.r - rand(0, 300); n.x = rand(0, W); n.c = (Math.random() * 3) | 0; } }
  for (const c of clouds) { c.y += c.s * sp * dt; if (c.y - c.r > H) { c.y = -c.r - rand(0, 900); c.x = rand(-50, W + 50); } }
}
function drawBg() {
  const p = pal();
  const gr = ctx.createLinearGradient(0, 0, 0, H);
  gr.addColorStop(0, p.bg1); gr.addColorStop(1, p.bg2);
  ctx.fillStyle = gr; ctx.fillRect(-40, -40, W + 80, H + 80);
  ctx.globalCompositeOperation = 'lighter';
  for (const n of nebs) G(p.neb[n.c], n.x, n.y, n.r * 2, .22, true);
  const sp = 1 + scrollBoost;
  for (const s of stars) {
    const a = (.35 + s.z * .65) * (.75 + .25 * Math.sin(T * 3 + s.tw));
    const len = s.z * s.z * 7 * sp + (sp > 1.5 ? s.z * 40 * (sp - 1) : 0);
    ctx.strokeStyle = `rgba(200,220,255,${a})`; ctx.lineWidth = s.z * 2;
    ctx.beginPath(); ctx.moveTo(s.x, s.y); ctx.lineTo(s.x, s.y - len - 1); ctx.stroke();
  }
  for (const c of clouds) G('#8fb4ff', c.x, c.y, c.r * 2, .05, true);
  ctx.globalCompositeOperation = 'source-over';
}

// ================= 파티클 =================
function P(o) { if (parts.length < 2600) parts.push(o); }
function sparks(x, y, n, color, spd = 300, size = 2, life = .4) {
  for (let i = 0; i < n; i++) { const a = rand(0, TAU), s = rand(.3, 1) * spd;
    P({ k: 'spark', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rand(.5, 1) * life, max: life, size, color, drag: .02 }); }
}
function explode(x, y, s = 1, color = '#ffb03d', silent) {
  P({ k: 'flash', x, y, vx: 0, vy: 0, life: .22, max: .22, size: 160 * s });
  sparks(x, y, Math.round(14 * s + 6), color, 520 * Math.sqrt(s), 2.5, .6);
  for (let i = 0; i < 8 * s + 3; i++) { const a = rand(0, TAU), v = rand(20, 140) * s;
    P({ k: 'fire', x: x + rand(-8, 8) * s, y: y + rand(-8, 8) * s, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: rand(.35, .7), max: .7, size: rand(30, 60) * s, grow: 60 * s, drag: .05 }); }
  for (let i = 0; i < 5 * s + 2; i++) { const a = rand(0, TAU), v = rand(10, 80) * s;
    P({ k: 'smoke', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v + 40, life: rand(.7, 1.3), max: 1.3, size: rand(10, 22) * s, grow: 30 * s, drag: .1 }); }
  for (let i = 0; i < 4 * s + 2; i++) { const a = rand(0, TAU), v = rand(120, 380) * Math.sqrt(s);
    P({ k: 'debris', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: rand(.6, 1.2), max: 1.2, size: rand(3, 7) * Math.sqrt(s), rot: rand(0, TAU), vr: rand(-15, 15), g: 300, drag: .3, color }); }
  rings.push({ x, y, maxr: 70 * s, life: .45, max: .45, color, w: 7 * s });
  if (s > 1.5) rings.push({ x, y, maxr: 140 * s, life: .8, max: .8, color: '#fff', w: 3 * s });
  addShake(5 * s);
  if (!silent) sfx.boom(s > 2.5);
}
function updParts(dt) {
  for (const p of parts) {
    p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.drag) { const d = Math.pow(p.drag, dt); p.vx *= d; p.vy *= d; }
    if (p.g) p.vy += p.g * dt;
    if (p.vr) p.rot += p.vr * dt;
    if (p.grow) p.size += p.grow * dt;
  }
  parts = parts.filter(p => p.life > 0);
  for (const r of rings) r.life -= dt; rings = rings.filter(r => r.life > 0);
  for (const t of texts) { t.life -= dt; t.y -= 40 * dt; } texts = texts.filter(t => t.life > 0);
}
function drawPartsNormal() {
  for (const p of parts) {
    const a = p.life / p.max;
    if (p.k === 'smoke') { ctx.fillStyle = `rgba(50,45,70,${a * .45})`; ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, TAU); ctx.fill(); }
    else if (p.k === 'debris') {
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.globalAlpha = Math.min(1, a * 2);
      ctx.fillStyle = '#2a2a3a'; ctx.strokeStyle = p.color; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.moveTo(-p.size, -p.size * .5); ctx.lineTo(p.size, 0); ctx.lineTo(-p.size * .4, p.size * .7); ctx.closePath();
      ctx.fill(); ctx.stroke(); ctx.restore();
    }
  }
  ctx.globalAlpha = 1;
}
function drawPartsGlow() {
  ctx.globalCompositeOperation = 'lighter';
  for (const p of parts) {
    const a = p.life / p.max;
    switch (p.k) {
      case 'spark':
        ctx.strokeStyle = p.color; ctx.globalAlpha = a; ctx.lineWidth = p.size;
        ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - p.vx * .035, p.y - p.vy * .035); ctx.stroke(); ctx.globalAlpha = 1; break;
      case 'fire': G(a > .7 ? '#ffe9a0' : a > .4 ? '#ff9a2a' : '#e8341a', p.x, p.y, p.size, Math.min(1, a * 1.6)); break;
      case 'glow': G(p.color, p.x, p.y, p.size * (p.shrink ? a : 1), a * (p.alpha || 1)); break;
      case 'flash': G('#fff4d8', p.x, p.y, p.size * (1.4 - a * .4), a); break;
    }
  }
  for (const r of rings) {
    const t = 1 - r.life / r.max, rad = r.maxr * eOutCubic(t);
    ctx.strokeStyle = r.color; ctx.globalAlpha = r.life / r.max; ctx.lineWidth = Math.max(.5, r.w * (1 - t));
    ctx.beginPath(); ctx.arc(r.x, r.y, rad, 0, TAU); ctx.stroke();
  }
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
}

// ================= 플레이어 =================
function newPlayer() {
  return { x: W / 2, y: H + 80, vx: 0, vy: 0, r: 7, hp: 100, maxhp: 100, hpTrail: 100, power: 1, bombs: 3,
    inv: 2.5, fireT: 0, misT: 0, bank: 0, alive: true, enter: 0, muzzle: 0, ghosts: [] };
}
function updPlayer(dt) {
  const p = player;
  if (!p.alive) return;
  p.inv = Math.max(0, p.inv - dt); p.muzzle = Math.max(0, p.muzzle - dt * 12);
  p.hpTrail = p.hpTrail > p.hp ? Math.max(p.hp, p.hpTrail - 40 * dt) : p.hp;
  let tx = 0;
  if (p.enter < 1) { // 등장 연출
    p.enter = Math.min(1, p.enter + dt / 1.2);
    p.y = lerp(H + 80, H - 150, eOutBack(p.enter)); p.x = W / 2;
  } else {
    let ax = 0, ay = 0;
    if (keys.ArrowLeft || keys.KeyA) ax--; if (keys.ArrowRight || keys.KeyD) ax++;
    if (keys.ArrowUp || keys.KeyW) ay--; if (keys.ArrowDown || keys.KeyS) ay++;
    const l = Math.hypot(ax, ay) || 1, sp = 440, k = Math.min(1, dt * 16);
    p.vx = lerp(p.vx, ax / l * sp, k); p.vy = lerp(p.vy, ay / l * sp, k);
    p.x += p.vx * dt; p.y += p.vy * dt; tx = p.vx / sp;
    if (ptr.dx || ptr.dy) {
      p.x += ptr.dx * 1.25; p.y += ptr.dy * 1.25;
      if (dt > 0) tx += clamp(ptr.dx * 1.25 / dt / 500, -1, 1);
      ptr.dx = ptr.dy = 0;
    }
    p.x = clamp(p.x, 24, W - 24); p.y = clamp(p.y, 60, H - 40);
  }
  p.bank = lerp(p.bank, clamp(tx, -1, 1), Math.min(1, dt * 10));
  // 잔상
  p.ghosts.unshift({ x: p.x, y: p.y, bank: p.bank }); if (p.ghosts.length > 6) p.ghosts.pop();
  // 엔진 화염 파티클
  for (const ex of [-7, 7]) P({ k: 'glow', x: p.x + ex * (1 - Math.abs(p.bank) * .25) + rand(-2, 2), y: p.y + 24, vx: rand(-20, 20), vy: rand(250, 380),
    life: rand(.15, .3), max: .3, size: rand(10, 18), color: Math.random() < .5 ? '#39a0ff' : '#8a5cff', shrink: 1 });
  if (p.enter < 1) return;
  // 사격
  p.fireT -= dt;
  if (p.fireT <= 0) {
    p.fireT = .085; const L = p.power; p.muzzle = 1;
    const shot = (x, y, a, dmg = 1, big = 0) => bullets.push({ x: p.x + x, y: p.y + y, vx: Math.sin(a) * 1150, vy: -Math.cos(a) * 1150, dmg, big, a });
    shot(-8, -16, 0); shot(8, -16, 0);
    if (L >= 2) { shot(-16, -6, -.1); shot(16, -6, .1); }
    if (L >= 4) { shot(-22, 0, -.24); shot(22, 0, .24); }
    if (L >= 5) shot(0, -26, 0, 2.5, 1);
    sfx.shoot();
  }
  if (p.power >= 3) {
    p.misT -= dt;
    if (p.misT <= 0) {
      p.misT = p.power >= 5 ? .32 : .55;
      for (const s of [-1, 1]) missiles.push({ x: p.x + s * 20, y: p.y + 6, vx: s * 260, vy: 60, life: 3, tgt: null });
    }
  }
}
function drawJet(x, y, bank, alpha = 1, ghost = false) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(bank * .12); ctx.scale(1 - Math.abs(bank) * .28, 1);
  ctx.globalAlpha = alpha;
  if (!ghost) {
    ctx.globalCompositeOperation = 'lighter';
    const fl = 1 + Math.sin(T * 70) * .15 + Math.random() * .25;
    for (const ex of [-7, 7]) {
      const gr = ctx.createLinearGradient(0, 18, 0, 18 + 34 * fl);
      gr.addColorStop(0, '#fff'); gr.addColorStop(.3, '#5cc8ff'); gr.addColorStop(1, 'rgba(60,80,255,0)');
      ctx.fillStyle = gr; ctx.beginPath(); ctx.moveTo(ex - 4, 18); ctx.quadraticCurveTo(ex, 18 + 50 * fl, ex + 4, 18); ctx.fill();
      G('#3aa8ff', ex, 22, 34 * fl, .9);
    }
    ctx.globalCompositeOperation = 'source-over';
  }
  // 날개
  const lw = bank < 0 ? '#e8f0ff' : '#9aa8c8', rw = bank > 0 ? '#e8f0ff' : '#9aa8c8';
  ctx.fillStyle = ghost ? '#4af' : lw;
  ctx.beginPath(); ctx.moveTo(-6, -6); ctx.lineTo(-32, 12); ctx.lineTo(-32, 19); ctx.lineTo(-7, 14); ctx.closePath(); ctx.fill();
  ctx.fillStyle = ghost ? '#4af' : rw;
  ctx.beginPath(); ctx.moveTo(6, -6); ctx.lineTo(32, 12); ctx.lineTo(32, 19); ctx.lineTo(7, 14); ctx.closePath(); ctx.fill();
  if (!ghost) {
    ctx.fillStyle = '#ff3d6e'; ctx.fillRect(-32, 12, 4, 7); ctx.fillRect(28, 12, 4, 7);
    ctx.fillStyle = '#5a6a90';
    ctx.beginPath(); ctx.moveTo(-4, 14); ctx.lineTo(-13, 26); ctx.lineTo(-4, 23); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(4, 14); ctx.lineTo(13, 26); ctx.lineTo(4, 23); ctx.closePath(); ctx.fill();
  }
  // 동체

// ================= 폭탄 =================
function useBomb() {

  bombWave = { x: p.x, y: p.y, t: 0 };
  sfx.bomb(); doFlash(.9); addShake(28); hitStop = .08; slowMo(.4, .7);
  banner('BOMB!!', '', '#ff5ad2', 1.2);
  for (const e of enemies) if (!e.dead) damage(e, e.type === 'boss' ? 45 : 40, e.x, e.y);
  for (let i = 0; i < 40; i++) { const a = i / 40 * TAU;
    P({ k: 'glow', x: p.x, y: p.y, vx: Math.cos(a) * 900, vy: Math.sin(a) * 900, life: .8, max: .8, size: 40, color: '#ff5ad2', drag: .2 }); }

// ================= 흐름 =================
function resetGame() {
  player = newPlayer();
  bullets = []; missiles = []; ebullets = []; enemies = []; parts = []; rings = []; texts = []; items = []; banners = []; queue = [];
  score = 0; dispScore = 0; combo = 0; comboT = 0; maxCombo = 0; kills = 0; stage = 1; newRecord = false;
  boss = null; bombWave = null; timeScale = 1; targetTS = 1; slowT = 0; paused = false;
}
function startGame() { resetGame(); state = 'play'; stateT = 0; sfx.start(); scrollBoost = 5; startStage(); }
function startStage() {
  stageT = 0; bossWarned = false; boss = null; spawnT = 2.5;
  banner(`STAGE ${stage}`, STAGE_NAMES[(stage - 1) % STAGE_NAMES.length], '#5ef', 2.6);
}
function directSpawns(dt) {
  if (!player.alive) return;
  stageT += dt;
  if (!bossWarned && stageT > 42) {
    bossWarned = true;
    later(1.5, () => { banner('WARNING', '거대 전함 접근 중', '#ff3050', 3.2, true); sfx.warn(); });
    later(4.5, () => { boss = spawn('boss', W / 2, -220); scrollBoost = 2; });
    return;
  }
  if (bossWarned) return;
  spawnT -= dt;
  if (spawnT <= 0) { spawnT = rand(1.3, 2.3) / (1 + (stage - 1) * .18 + stageT * .006); pickPattern(); }
}

function update(dt, rdt) {
  T += rdt; stateT += rdt;
  scrollBoost = lerp(scrollBoost, 0, Math.min(1, rdt * 1.2));
  if (slowT > 0) { slowT -= rdt; if (slowT <= 0) targetTS = 1; }
  timeScale = lerp(timeScale, targetTS, Math.min(1, rdt * 5));
  shake *= Math.pow(.004, rdt); if (shake < .2) shake = 0;
  flash = Math.max(0, flash - rdt * 2.5); dmgFlash = Math.max(0, dmgFlash - rdt * 2);
  scorePop = Math.max(0, scorePop - rdt * 4); comboPop = Math.max(0, comboPop - rdt * 4);
  for (const b of banners) b.t += rdt; banners = banners.filter(b => b.t < b.dur);

  updBg(dt);
  if (state === 'title') {
    updParts(dt);
    if (Math.random() < rdt * 1.5) explode(rand(60, W - 60), rand(80, 420), rand(.5, 1.4), ['#ff4d6d', '#4dd2ff', '#c86bff', '#ffb03d'][(Math.random() * 4) | 0], true);
    const tx = W / 2 + Math.sin(T * 1.1) * 140, ty = H * .66 + Math.sin(T * 2.2) * 30;
    for (const ex of [-7, 7]) P({ k: 'glow', x: tx + ex, y: ty + 24, vx: 0, vy: 300, life: .25, max: .25, size: 15, color: '#39a0ff', shrink: 1 });
    if (startPressed) startGame();
    startPressed = false; return;
  }
  if (state === 'over') {
    updParts(dt); for (const e of enemies) updEnemy(e, dt); updShots(dt); updItems(dt);
    enemies = enemies.filter(e => !e.dead); ebullets = ebullets.filter(b => !b.dead);
    if (startPressed && stateT > 1.4) startGame();
    startPressed = false; return;
  }
  // ===== play =====
  startPressed = false;
  if (paused) { bombPressed = false; return; }
  if (bombPressed) { useBomb(); bombPressed = false; }

  for (const q of queue) q.t -= dt;
  const due = queue.filter(q => q.t <= 0); queue = queue.filter(q => q.t > 0); due.forEach(q => q.fn());

  directSpawns(dt);
  updPlayer(dt);
  for (const e of enemies) updEnemy(e, dt);
  updShots(dt); updBomb(dt); updItems(dt);

  // 충돌: 플레이어 탄 → 적
  for (const b of bullets) {
    if (b.dead) continue;
    for (const e of enemies) {
      if (e.dead) continue;
      const rr = e.r + 5;
      if ((b.x - e.x) ** 2 + (b.y - e.y) ** 2 < rr * rr) { b.dead = true; damage(e, b.dmg, b.x, b.y); break; }
    }
  }
  for (const m of missiles) {
    if (m.dead) continue;
    for (const e of enemies) {
      if (e.dead) continue;
      const rr = e.r + 6;
      if ((m.x - e.x) ** 2 + (m.y - e.y) ** 2 < rr * rr) { m.dead = true; damage(e, 3, m.x, m.y); explode(m.x, m.y, .4, '#ffa040', true); break; }
    }
  }
  // 적 탄 / 몸체 → 플레이어
  const p = player;
  if (p.alive) {
    for (const b of ebullets) {
      if (b.dead) continue;
      const rr = b.r * .7 + p.r;
      if ((b.x - p.x) ** 2 + (b.y - p.y) ** 2 < rr * rr) { b.dead = true; hurtPlayer(boss ? 14 : 11); }
    }
    for (const e of enemies) {
      if (e.dead || (e.type === 'boss' && e.state !== 'fight')) continue;
      const rr = e.r * .8 + p.r;
      if ((e.x - p.x) ** 2 + (e.y - p.y) ** 2 < rr * rr) { if (p.inv <= 0) { hurtPlayer(22); if (e.type !== 'boss') damage(e, 15, e.x, e.y); } }
    }
  }
  bullets = bullets.filter(b => !b.dead); missiles = missiles.filter(m => !m.dead);
  ebullets = ebullets.filter(b => !b.dead); enemies = enemies.filter(e => !e.dead);

  if (comboT > 0) { comboT -= dt; if (comboT <= 0) combo = 0; }
  updParts(dt);

  if (!p.alive) {
    deathT += rdt;
    if (deathT > 2.4) {
      state = 'over'; stateT = 0; targetTS = 1; slowT = 0;
      if (score > hiscore) { hiscore = score; newRecord = true; try { localStorage.setItem('skystriker_hi', hiscore); } catch (e) {} }
    }
  }
}

    if (lt > 0) {
      const sc = eOutBack(lt), oy = (1 - eOutCubic(lt)) * -60;
      ctx.save(); ctx.translate(x + ws[i] / 2, y + (b.sub ? -12 : 0) + oy); ctx.scale(sc, sc); ctx.rotate((1 - lt) * .6);
      ctx.globalAlpha = lt * (1 - outK) * blink;
      ctx.shadowColor = b.color; ctx.shadowBlur = 22; txt(c, 0, 0, size, '#fff', 'center', 900);
      ctx.restore();
    }
    x += ws[i];
  });
  if (b.sub) { const st = clamp((t - .4) / .3, 0, 1); ctx.globalAlpha = st * (1 - outK); txt(b.sub, W / 2 + (1 - st) * 40, y + 30, 17, b.color, 'center', 700); ctx.globalAlpha = 1; }
  ctx.restore();
}

function drawTitle() {
  const tx = W / 2 + Math.sin(T * 1.1) * 140, ty = H * .66 + Math.sin(T * 2.2) * 30;
  drawJet(tx, ty, -Math.cos(T * 1.1) * .9);
  // 로고
  const word = 'SKY STRIKER'; ctx.font = '900 64px system-ui,sans-serif';
  const chars = [...word], ws = chars.map(c => ctx.measureText(c).width), tw = ws.reduce((a, c) => a + c, 0);
  let x = W / 2 - tw / 2;
  chars.forEach((c, i) => {
    const intro = clamp((stateT - i * .06) / .6, 0, 1);
    const y = 230 + Math.sin(T * 3 - i * .45) * 9 - (1 - eOutElastic(intro)) * 200;
    const hue = (T * 60 + i * 22) % 360;
    ctx.save(); ctx.translate(x + ws[i] / 2, y); ctx.rotate(Math.sin(T * 2 - i * .5) * .06);
    ctx.globalAlpha = intro;
    ctx.shadowColor = `hsl(${hue},100%,60%)`; ctx.shadowBlur = 30;
    txt(c, 3, 4, 64, `hsl(${hue},90%,35%)`, 'center', 900);
    txt(c, 0, 0, 64, '#fff', 'center', 900);
    ctx.restore();
    x += ws[i];
  });
  const st = clamp((stateT - .8) / .5, 0, 1); ctx.globalAlpha = st;
  txt('— 은하 방위 비행대 —', W / 2, 290, 18, '#8fb4ff', 'center', 700);
  if (Math.sin(T * 5) > -.4) glowTxt('SPACE / 터치하여 출격', W / 2, 420, 24, '#3ee6ff');
  txt('이동: 방향키 · WASD · 드래그     자동 사격', W / 2, H - 120, 14, '#a0b0d0', 'center', 600);
  txt('폭탄: X 키 · 우하단 버튼     일시정지: P', W / 2, H - 96, 14, '#a0b0d0', 'center', 600);
  if (hiscore) txt('HIGH SCORE  ' + hiscore.toLocaleString(), W / 2, H - 56, 16, '#ffe066', 'center', 800);
  ctx.globalAlpha = 1;
}
function drawOver() {
  ctx.fillStyle = `rgba(0,0,10,${Math.min(.6, stateT * .6)})`; ctx.fillRect(0, 0, W, H);
  const word = 'GAME OVER'; ctx.font = '900 62px system-ui,sans-serif';
  const chars = [...word], ws = chars.map(c => ctx.measureText(c).width), tw = ws.reduce((a, c) => a + c, 0);
  let x = W / 2 - tw / 2;
  chars.forEach((c, i) => {
    const lt = clamp((stateT - i * .07) / .8, 0, 1);
    const y = 300 - (1 - eOutElastic(lt)) * 400;
    ctx.save(); ctx.translate(x + ws[i] / 2, y); ctx.rotate((1 - lt) * (i % 2 ? .8 : -.8)); ctx.globalAlpha = Math.min(1, lt * 3);
    ctx.shadowColor = '#ff3050'; ctx.shadowBlur = 30; txt(c, 0, 0, 62, '#fff', 'center', 900); ctx.restore();
    x += ws[i];
  });
  const rows = [['SCORE', score.toLocaleString()], ['STAGE', stage], ['MAX COMBO', maxCombo], ['격추 수', kills]];
  rows.forEach(([k, v], i) => {
    const lt = clamp((stateT - .8 - i * .12) / .4, 0, 1); ctx.globalAlpha = lt;
    const ox = (1 - eOutCubic(lt)) * (i % 2 ? 80 : -80);
    txt(k, W / 2 - 130 + ox, 400 + i * 42, 16, '#8fb4ff', 'left', 700);
    txt(String(v), W / 2 + 130 + ox, 400 + i * 42, 24, '#fff', 'right', 900);
  });
  ctx.globalAlpha = 1;
  if (newRecord && stateT > 1.4) { ctx.save(); ctx.translate(W / 2, 590); const s = 1 + Math.sin(T * 8) * .08; ctx.scale(s, s); glowTxt('★ NEW RECORD ★', 0, 0, 28, '#ffe066'); ctx.restore(); }
  if (stateT > 1.4 && Math.sin(T * 5) > -.4) glowTxt('SPACE / 터치하여 재출격', W / 2, 670, 22, '#3ee6ff');
}

// ================= 렌더 =================
function render(dt) {
  const base = SC * DPR;
  ctx.setTransform(base, 0, 0, base, 0, 0);
  ctx.save();
  if (shake) ctx.translate(rand(-shake, shake), rand(-shake, shake));
  drawBg();
  drawPartsNormal();
  if (state === 'title') { drawPartsGlow(); }
  else {
    drawItems();
    for (const e of enemies) drawEnemy(e);
    drawPlayer();
    drawShots();
    drawPartsGlow();
    drawBomb();
    for (const t of texts) {
      const k = 1 - t.life / t.max, s = eOutBack(Math.min(1, k * 5)) * (t.life < .2 ? t.life / .2 : 1);
      ctx.save(); ctx.translate(t.x, t.y); ctx.scale(s, s); ctx.shadowColor = t.color; ctx.shadowBlur = 12;
      txt(t.text, 0, 0, t.size, t.color, 'center', 900); ctx.restore();
    }
  }
  ctx.restore();
  ctx.drawImage(VIG, 0, 0);
  if (dmgFlash > 0) { ctx.globalAlpha = dmgFlash; ctx.drawImage(DVIG, 0, 0); ctx.globalAlpha = 1; }
  if (player && player.alive && state === 'play' && player.hp / player.maxhp < .3) { ctx.globalAlpha = .25 + .2 * Math.sin(T * 6); ctx.drawImage(DVIG, 0, 0); ctx.globalAlpha = 1; }
  if (state === 'title') drawTitle();
  if (state === 'play' || state === 'over') drawHUD(dt);
  for (const b of banners) drawBanner(b);
  if (state === 'over') drawOver();
  if (paused && state === 'play') {
    ctx.fillStyle = 'rgba(0,0,15,.6)'; ctx.fillRect(0, 0, W, H);
    glowTxt('PAUSED', W / 2, H / 2 - 20, 56, '#5ef');
    txt('P 키 또는 터치로 계속', W / 2, H / 2 + 30, 16, '#a0b0d0', 'center', 600);
  }
  if (flash > 0) { ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = Math.min(1, flash); ctx.fillStyle = flashColor; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; }
}

// ================= 루프 =================
player = newPlayer();
let last = performance.now();
function frame(now) {
  const rdt = Math.min(.05, (now - last) / 1000); last = now;
  if (hitStop > 0) { hitStop -= rdt; T += rdt; render(rdt); }
  else { const dt = (state === 'play' && paused) ? 0 : rdt * timeScale; update(dt, rdt); render(rdt); }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
